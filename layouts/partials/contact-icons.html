{{- $email := site.Params.author.email -}}
{{- $github := site.Params.social.github -}}
<span class="contact-icons">
  {{- with $email }}
  <a href="mailto:{{ . }}" target="_blank" rel="noopener" aria-label="Email" title="Email">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 6 10 7 10-7"/></svg>
  </a>
  {{- end }}
  {{- with $github }}
  <a href="https://github.com/{{ . }}" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.2.8-.5v-2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.8 18.3 5 18.3 5c.7 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.5-2.7 5.5-5.3 5.8.4.4.8 1.1.8 2.2v3.3c0 .3.2.6.8.5 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z"/></svg>
  </a>
  {{- end }}
  <button type="button" class="theme-toggle-icon" aria-label="Toggle light/dark" title="Toggle light/dark">
    <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</span>
<script>
(function () {
  var key = 'theme';
  var body = document.body;
  var btn = document.currentScript.previousElementSibling.querySelector('.theme-toggle-icon');
  if (!btn) return;

  function effective(theme) {
    if (theme === 'light' || theme === 'dark') return theme;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  function render() {
    var isDark = effective(body.getAttribute('a') || localStorage.getItem(key) || 'auto') === 'dark';
    btn.classList.toggle('is-dark', isDark);
  }

  btn.addEventListener('click', function () {
    var next = effective(body.getAttribute('a') || localStorage.getItem(key) || 'auto') === 'dark' ? 'light' : 'dark';
    body.setAttribute('a', next);
    localStorage.setItem(key, next);
    render();
    document.dispatchEvent(new CustomEvent('themechange', { detail: next }));
  });

  render();
})();
</script>
